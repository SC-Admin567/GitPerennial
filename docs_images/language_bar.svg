<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>GitPerennial language breakdown (private development repository): JavaScript 39.8%, C# 38.6%, PHP 6.9%, HTML 6.6%, Shell 4.5%, Other 2.6%, Swift 1%</title>

  <!-- Stacked bar, left to right by descending percentage, rounded ends -->
  <clipPath id="bar-clip">
    <rect x="0" y="0" width="760" height="14" rx="7" ry="7"/>
  </clipPath>
  <g clip-path="url(#bar-clip)">
    <!-- widths: 760px total, 1px = ~0.1316%; x offsets are cumulative -->
    <rect x="0"   y="0" width="302.5" height="14" fill="#f1e05a"/> <!-- JavaScript 39.8% -->
    <rect x="302.5" y="0" width="293.4" height="14" fill="#178600"/> <!-- C# 38.6% -->
    <rect x="595.9" y="0" width="52.4"  height="14" fill="#4F5D95"/> <!-- PHP 6.9% -->
    <rect x="648.3" y="0" width="50.2"  height="14" fill="#e34c26"/> <!-- HTML 6.6% -->
    <rect x="698.5" y="0" width="34.2"  height="14" fill="#89e051"/> <!-- Shell 4.5% -->
    <rect x="732.7" y="0" width="19.8"  height="14" fill="#cccccc"/> <!-- Other 2.6% -->
    <rect x="752.5" y="0" width="7.6"   height="14" fill="#F05138"/> <!-- Swift 1% -->
  </g>

  <!-- Legend, two rows -->
  <g font-size="14" fill="#1f2328">
    <circle cx="8"   cy="40" r="5" fill="#f1e05a"/>
    <text x="20" y="45">JavaScript 39.8%</text>

    <circle cx="190" cy="40" r="5" fill="#178600"/>
    <text x="202" y="45">C# 38.6%</text>

    <circle cx="330" cy="40" r="5" fill="#4F5D95"/>
    <text x="342" y="45">PHP 6.9%</text>

    <circle cx="450" cy="40" r="5" fill="#e34c26"/>
    <text x="462" y="45">HTML 6.6%</text>

    <circle cx="580" cy="40" r="5" fill="#89e051"/>
    <text x="592" y="45">Shell 4.5%</text>

    <circle cx="8"   cy="70" r="5" fill="#cccccc"/>
    <text x="20" y="75">Other 2.6%</text>

    <circle cx="150" cy="70" r="5" fill="#F05138"/>
    <text x="162" y="75">Swift 1%</text>
  </g>

  <text x="0" y="100" font-size="12" fill="#57606a">Private development repository — this repo ships installers and docs only, no source.</text>
</svg>
